---
# Machine-specific values. Override per target (host_vars/ or --extra-vars).
# NO SECRETS HERE. Secrets are passed at run time (see README).

host_hostname: debiani7
host_username: inspiron
host_uid: 1000
host_groups:
  - sudo
  - adm
  - cdrom
  - audio
  - video
  - plugdev
  - users
  - netdev

timezone: America/Chicago

# Public SSH keys provisioned to the primary user (authorized_keys).
# These are PUBLIC keys only - safe to commit. Private keys never in repo.
ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIInDhEistRIJ7GX4CYPf7yEJY98p7HTh7RDRHNaYA2yi inspiron@debiani7"

# sshd hardening (reconstruct known-good lockdown from source host).
# Quoted strings: sshd accepts only lowercase yes/no (YAML booleans render as
# capitalized True/False and would break sshd config).
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 3
ssh_allow_users: "{{ host_username }}"
ssh_x11_forwarding: "yes"         # keep on to match source host; disable for headless
ssh_accept_env: "LANG LC_* COLORTERM NO_COLOR"

# Tailscale. Enable only if you supply an auth key at run time (secret).
#   ansible-playbook playbook.yml -e tailscale_authkey=tskey-...
tailscale_enable: false
tailscale_hostname: "{{ host_hostname }}"

# Packages to install (reconstruct deliberate host tooling of source host).
# firmware-*/intel-microcode are laptop-specific, omitted for VPS targets.
apt_packages:
  - tailscale
  - podman-docker
  - fail2ban
  - ufw
  - nftables
  - unattended-upgrades
  - tmux
  - btop
  - htop
  - git
  - curl
  - rsync
  - tree
  - nnn
  - autojump
  - build-essential
  - ethtool
  - iftop
  - nethogs
  - lsof
  - lm-sensors
  - parted
  - timeshift
  - cron
  - logrotate
  - openssh-server
  - tzdata
  - locales
  - ca-certificates
  - gnupg

# Firewall (ufw): default deny incoming, allow outbound. SSH allowed explicitly.
ufw_default_deny_incoming: true
ufw_default_allow_outgoing: true
ufw_allow_ports:
  - "{{ ssh_port }}/tcp"

ssh_port: 22
