#!/usr/bin/env bash

set -g status "on"
set -g status-justify "centre"
set -g status-left-length "100"
set -g status-right-length "100"

set -g message-command-style fg="colour7",bg="colour11"
set -g message-style fg="colour7",bg="colour0"

setw -g window-status-style bg="colour12",fg="colour12"
setw -g window-status-activity-style bg="colour12",fg="colour12"
setw -g window-status-separator "  "

# set -g status-style fg="colour15",bg="colour8"
set -g status-style fg="colour7",bg="colour0"

set -g status-left ""
set -ga status-left "[G]"

setw -g window-status-current-format "#[fg=colour15,bg=colour0]"
setw -ga window-status-current-format "#(~/devbox/dotfiles/tmux/_middle.sh '#{window_id}')"
setw -g window-status-format "#[fg=colour7,bg=colour0]#(~/devbox/dotfiles/tmux/_middle.sh '#{window_id}')"

set -g status-right "[G]"
