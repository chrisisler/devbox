name: Reject co-authored commits

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reject-co-authored-by:
    runs-on: ubuntu-latest
    steps:
      - name: Check commit trailers
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Co-authored-by trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "pull_request" ]; then
            commit_range="$BASE_SHA..$HEAD_SHA"
            commits="$(git rev-list "$commit_range")"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            commits="$(git rev-list --no-walk "$CURRENT_SHA")"
          else
            commit_range="$BEFORE_SHA..$CURRENT_SHA"
            commits="$(git rev-list "$commit_range")"
          fi

          failed=0
          for commit in $commits; do
            trailer="$(git show -s --format='%(trailers:key=Co-authored-by)' "$commit")"
            if [ -n "$trailer" ]; then
              printf 'Commit %s contains a Co-authored-by trailer.\n' "$commit"
              failed=1
            fi
          done

          exit "$failed"
